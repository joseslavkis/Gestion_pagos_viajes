name: CI (Tests & Build)

on:
  pull_request:
    branches: [main, dev, split/payment-money-db, split/payment-money-backend]
  push:
    branches: [main, dev]

jobs:
  # Verifica que el backend funcione
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Run Tests
        working-directory: backend
        run: ./mvnw test

  # Verifica que el frontend compile
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install, Test & Build
        working-directory: frontend
        run: |
          npm ci
          npx vitest run
          npm run build

  payment-money-backend:
    name: Payment Money Backend Gate
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Check isolated concurrency runner
        run: shellcheck scripts/test-payment-concurrency.sh
      - name: Run focused money and migration/schema contracts
        working-directory: backend
        run: |
          ./mvnw -Dtest=PaymentMoneySchemaMigrationTest,PaymentMoneyPolicyTest,PaymentAllocationPlannerTest,PaymentRestControllerTest,ExchangeRateServiceTest test
      - name: Exercise isolated concurrent payment review and void
        run: ./scripts/test-payment-concurrency.sh

  deploy-backend-vps:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-main
      cancel-in-progress: false
    needs:
      - backend-tests
      - frontend-build
      - payment-money-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -eu
            DEPLOY_SHA="${{ github.sha }}"
            test -n "$DEPLOY_SHA"
            cd /opt/apps/Gestion_pagos_viajes
            git fetch origin
            git cat-file -e "$DEPLOY_SHA^{commit}"
            CURRENT_MAIN_SHA="$(git rev-parse origin/main^{commit})"
            if [ "$CURRENT_MAIN_SHA" != "$DEPLOY_SHA" ]; then
              echo "Skipping stale deploy: origin/main is at $CURRENT_MAIN_SHA, target is $DEPLOY_SHA"
              exit 0
            fi
            git reset --hard "$DEPLOY_SHA"
            ACTUAL_SHA="$(git rev-parse HEAD)"
            echo "Deploy target SHA: $DEPLOY_SHA"
            echo "Checked out SHA:   $ACTUAL_SHA"
            test "$ACTUAL_SHA" = "$DEPLOY_SHA"
            ./scripts/check-payment-schema-readiness.sh
            SPRING_PROFILES_ACTIVE=production SPRING_JPA_HIBERNATE_DDL_AUTO=validate docker compose up -d --build backend
